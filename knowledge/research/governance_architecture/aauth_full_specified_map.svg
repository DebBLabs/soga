<text x="155" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">signs every request</text>

<line x1="250" y1="368" x2="440" y2="368" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<g fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"><rect x="440" y="340" width="190" height="56" rx="8"/></g>
<text x="535" y="360" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Resource</text>
<text x="535" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">publishes R3, issues token</text>

<text x="40" y="450" font-family="Arial, sans-serif" font-size="10" fill="#888780">Verified against spec text: Protocol Overview, Person Server, Mission, R3 vocabulary sections. Solid lines = specified relationships.</text>
