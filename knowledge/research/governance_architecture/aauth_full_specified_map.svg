<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AAuth as fully specified today, verified against draft-hardt-oauth-aauth-protocol</title>
<desc>Agent Provider issues the agent token. The agent signs requests to the resource and separately proposes a mission to the person server. The resource publishes an R3 vocabulary describing its operations, fetched by both the Person Server and the Access Server, not the agent. The person server federates with the access server for authorization.</desc>
